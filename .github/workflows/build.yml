name: Build Raw Metal Progression

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack project archive
        shell: bash
        run: |
          mkdir -p unpacked
          shopt -s nullglob
          archives=( *.zip )
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "No ZIP archive found in repository root."
            exit 1
          fi
          unzip -q "${archives[0]}" -d unpacked
          find unpacked -type f \( -name build.gradle -o -name build.gradle.kts \) -print

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        shell: bash
        run: |
          build_file="$(find unpacked -type f \( -name build.gradle -o -name build.gradle.kts \) | head -n 1)"
          if [ -z "$build_file" ]; then
            echo "Could not find build.gradle or build.gradle.kts in the ZIP archive."
            exit 1
          fi
          project_dir="$(dirname "$build_file")"
          cd "$project_dir"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew build
          else
            gradle build
          fi

      - name: Upload built JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RawMetalProgression-JAR
          path: unpacked/**/build/libs/*.jar
          if-no-files-found: error
