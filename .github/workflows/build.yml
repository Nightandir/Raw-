name: Build Raw Metal Progression

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack project archive
        shell: bash
        run: |
          mkdir -p unpacked
          shopt -s nullglob
          archives=( *.zip )
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "No ZIP archive found in repository root."
            exit 1
          fi
          unzip -q "${archives[0]}" -d unpacked
          find unpacked -type f \( -name build.gradle -o -name build.gradle.kts \) -print

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Patch identifier class name for Minecraft 1.21.11
        shell: bash
        run: |
          source_file="$(find unpacked -path '*/src/main/java/*/RawMetalProgression.java' -print -quit)"
          if [ -z "$source_file" ]; then
            echo "Main mod source file not found."
            exit 1
          fi
          sed -i 's/ResourceLocation/Identifier/g; s/net.minecraft.resources.Identifier/net.minecraft.resources.Identifier/' "$source_file"
          sed -i 's/import net.minecraft.resources.Identifier;/import net.minecraft.resources.Identifier;/' "$source_file"
          grep -n 'Identifier' "$source_file"

      - name: Install updated textures and 1.21.11 recipes
        shell: bash
        run: |
          resource_dir="$(find unpacked -type d -path '*/src/main/resources/assets/rawmetal/textures/item' -print -quit)"
          recipe_dir="$(find unpacked -type d -path '*/src/main/resources/data/rawmetal/recipe' -print -quit)"
          if [ -z "$resource_dir" ] || [ -z "$recipe_dir" ]; then
            echo "Raw Metal Progression resource directories not found."
            exit 1
          fi
          install -m 644 textures/raw_iron_nugget.png "$resource_dir/raw_iron_nugget.png"
          install -m 644 textures/raw_gold_nugget.png "$resource_dir/raw_gold_nugget.png"
          install -m 644 textures/raw_copper_nugget.png "$resource_dir/raw_copper_nugget.png"
          for recipe in recipes/*.json; do
            install -m 644 "$recipe" "$recipe_dir/$(basename "$recipe")"
          done
          echo "Installed three textures and nine corrected recipes."
          ls -l "$recipe_dir"

      - name: Build mod
        shell: bash
        run: |
          build_file="$(find unpacked -type f \( -name build.gradle -o -name build.gradle.kts \) | head -n 1)"
          if [ -z "$build_file" ]; then
            echo "Could not find build.gradle or build.gradle.kts in the ZIP archive."
            exit 1
          fi
          project_dir="$(dirname "$build_file")"
          cd "$project_dir"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew build
          else
            gradle build
          fi

      - name: Upload built JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RawMetalProgression-JAR
          path: unpacked/**/build/libs/*.jar
          if-no-files-found: error
